name: Materialize roster CSV files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Show available staging files
        shell: bash
        run: |
          set -euxo pipefail
          find staging -maxdepth 1 -type f -print | sort

      - name: Rebuild and verify roster files
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/materialize_rosters.py

      - name: Commit roster files
        shell: bash
        run: |
          set -euxo pipefail
          rm -f staging/goalies.csv.gz.b64.part* staging/skaters.csv.gz.b64.*

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/input/STHSGoaliesRoster.csv data/input/STHSPlayerRoster.csv
          git add -u staging

          if git diff --cached --quiet; then
            echo "No roster changes to commit."
            exit 0
          fi

          git commit -m "Add THL skater and goalie rosters"
          git push origin HEAD:main
