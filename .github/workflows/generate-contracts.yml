name: Generate THL contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-contracts.yml"
      - "config/config.json"
      - "pytest.ini"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"
      - "data/input/STHSPlayerRoster.csv"
      - "data/input/STHSGoaliesRoster.csv"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Python tests
        run: pytest -q

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install nhlscraper
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::nhlscraper
          cache-version: 1

      - name: Export nhlscraper contracts
        run: Rscript scripts/export_nhlscraper_contracts.R

      - name: Match THL contracts
        run: python scripts/match_contracts.py

      - name: Show match summary
        run: cat reports/match_summary.json

      - name: Upload contract results
        uses: actions/upload-artifact@v4
        with:
          name: thl-contract-results
          path: |
            data/output/thl_contracts.csv
            reports/match_summary.json
            reports/unmatched_players.csv
            reports/ambiguous_matches.csv
          if-no-files-found: error
          retention-days: 14
